spring:
  application:
    name: conference-planner
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/conference}
    username: ${DATABASE_USER:conference}
    password: ${DATABASE_PASSWORD:conference}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

logging:
  level:
    dev.conferenceplanner: INFO
