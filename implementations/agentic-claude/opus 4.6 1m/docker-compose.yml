services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: conference
      POSTGRES_USER: conference
      POSTGRES_PASSWORD: conference
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conference -d conference"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/conference
      SPRING_DATASOURCE_USERNAME: conference
      SPRING_DATASOURCE_PASSWORD: conference
      SPRING_PROFILES_ACTIVE: local-demo
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
