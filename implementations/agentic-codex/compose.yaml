services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: conference
      POSTGRES_USER: conference
      POSTGRES_PASSWORD: conference
    ports:
      - "127.0.0.1:${DB_PORT:-54329}:5432"
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conference -d conference"]
      interval: 2s
      timeout: 2s
      retries: 30
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/conference
      SERVER_ADDRESS: 0.0.0.0
      SPRING_PROFILES_ACTIVE: local-demo
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 3s
      timeout: 4s
      retries: 20
      start_period: 30s
volumes:
  data:
