spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:54329/conference}
    username: ${DB_USER:conference}
    password: ${DB_PASSWORD:conference}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  error:
    include-message: never
