<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conference Planner</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><p class="eyebrow">AI Coding à la Carte</p><h1>Conference Planner</h1>
<label>Demo identity <select id="identity"><option value="alice">Alice</option><option value="bob">Bob</option></select></label>
<p class="hint">A local demo identity selector. This is not authentication.</p></header>
<main>
<nav aria-label="Views"><button id="sessions-tab" aria-pressed="true">Sessions</button><button id="bookings-tab" aria-pressed="false">My bookings</button><a href="demo.html">Local demo panel</a></nav>
<p id="status" role="status" aria-live="polite">Loading sessions…</p>
<section id="sessions-view"><h2>Conference sessions</h2>
<div class="table-wrap"><table><thead><tr><th>Session</th><th>Room</th><th>Capacity</th><th>Active bookings</th><th>Available places</th><th>Action</th></tr></thead><tbody id="sessions"></tbody></table></div>
<div class="pagination"><button id="previous">Previous</button><span id="page-label"></span><button id="next">Next</button></div></section>
<section id="bookings-view" hidden><h2>My bookings</h2><div id="bookings"></div></section>
</main><script src="app.js" defer></script>
</body></html>
