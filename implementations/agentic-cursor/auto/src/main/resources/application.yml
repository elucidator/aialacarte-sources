spring:
  application:
    name: conference-planner
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:conference}
    username: ${DB_USER:conference}
    password: ${DB_PASSWORD:conference}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true

# Custom health at /health (not only actuator /actuator/health)
conference:
  notification:
    max-attempts: 5
    simulate-ack-timeout-ms: 50

logging:
  level:
    root: INFO
    com.conference.planner: INFO
